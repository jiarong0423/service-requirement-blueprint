{% extends 'base.html' %}
{% block title %}{{ tr('page.login') }} · {{ tr('app.name') }}{% endblock %}
{% block content %}
<section class="card narrow"><h1>{{ tr('page.login') }}</h1>
{% if error %}<p class="error">{{ tr(error) }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>{{ tr('field.email') }}<input name="email" type="email" required autocomplete="username"></label>
<label>{{ tr('field.password') }}<input name="password" type="password" required autocomplete="current-password"></label>
<button>{{ tr('action.sign_in') }}</button></form></section>
{% endblock %}
